name: Migrations → staging

# Déclenchement manuel : applique les migrations versionnées au projet Supabase menao-staging.
# Secrets requis (Settings → Secrets and variables → Actions) :
#   SUPABASE_ACCESS_TOKEN, SUPABASE_STAGING_PROJECT_REF, SUPABASE_STAGING_DB_PASSWORD
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: db-deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_STAGING_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec supabase link --project-ref "${{ secrets.SUPABASE_STAGING_PROJECT_REF }}"
      - name: Migrations en attente
        run: pnpm exec supabase migration list
      - name: Appliquer les migrations (sans seed)
        run: pnpm exec supabase db push

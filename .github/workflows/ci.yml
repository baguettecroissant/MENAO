name: CI

# Sur chaque PR (complète) et sur main après fusion (contrôles rapides : la PR a déjà tout testé).
# Ouvrir une PR (même en brouillon) pour tester une branche. Une PR qui ne touche que la
# documentation ne lance pas la CI. Dépôt public : runners de GitHub gratuits (ADR 0053).
on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.7
      - name: Vérifier les Edge Functions (Deno)
        run: pnpm functions:check

  database:
    name: Base de données (migrations, RLS pgTAP, types)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Démarrer Postgres (migrations + seed)
        id: db
        run: pnpm exec supabase db start
      - name: Tests pgTAP
        run: pnpm exec supabase test db
      - name: Vérifier que les types générés sont à jour
        # Même si des tests pgTAP échouent : les types restent utiles pour avancer.
        if: ${{ !cancelled() && steps.db.outcome == 'success' }}
        run: |
          pnpm db:types
          git diff --exit-code packages/db/src/types.ts
      - name: Publier les types générés (en cas d'écart)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: packages/db/src/types.ts
          retention-days: 2

  e2e:
    name: Bout en bout (Playwright)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Démarrer stripe-mock (faux Stripe officiel)
        run: docker run -d --name stripe-mock -p 12111:12111 stripe/stripe-mock:v0.206.0
      - name: Démarrer Supabase local (Postgres, Auth, API, Storage, Edge Functions, Mailpit)
        # Les Edge Functions appellent les faux serveurs Sirene, IA et DocuSeal (lancés par
        # Playwright) et stripe-mock, tous sur l'hôte.
        env:
          INSEE_API_BASE_URL: http://host.docker.internal:18399
          INSEE_API_KEY: cle-factice-ci
          RGE_API_BASE_URL: http://host.docker.internal:18399/rge/lines
          STRIPE_SECRET_KEY: sk_test_menaoci
          STRIPE_WEBHOOK_SECRET: whsec_menao_ci
          STRIPE_CONNECT_WEBHOOK_SECRET: whsec_menao_connect_ci
          STRIPE_TAX_RATE_ID: txr_menao_ci
          STRIPE_API_HOST: host.docker.internal
          STRIPE_API_PORT: "12111"
          STRIPE_API_PROTOCOL: http
          SITE_URLS: http://localhost:3000
          OPENROUTER_API_KEY: cle-factice-ci
          OPENROUTER_BASE_URL: http://host.docker.internal:18398
          GEOCODING_BASE_URL: http://host.docker.internal:18398
          DOCUSEAL_API_URL: http://host.docker.internal:18397
          DOCUSEAL_API_KEY: cle-factice-ci
          DOCUSEAL_WEBHOOK_SECRET: whsec_menao_ci
        run: pnpm exec supabase start -x studio,imgproxy,logflare,vector,supavisor,realtime,postgres-meta
      - name: Variables d'environnement de l'application
        run: |
          STATUS=$(pnpm exec supabase status -o json)
          {
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "NEXT_PUBLIC_SUPABASE_URL=$(jq -r '.API_URL' <<<"$STATUS")"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$(jq -r '.PUBLISHABLE_KEY // .ANON_KEY' <<<"$STATUS")"
            # Clé serveur de l'instance locale (éphémère) : simulation des tâches planifiées en e2e.
            echo "SUPABASE_SERVICE_ROLE_KEY=$(jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY' <<<"$STATUS")"
            echo "MAILPIT_URL=$(jq -r '.MAILPIT_URL // .INBUCKET_URL // "http://127.0.0.1:54324"' <<<"$STATUS")"
            echo "STRIPE_WEBHOOK_SECRET=whsec_menao_ci"
            echo "STRIPE_CONNECT_WEBHOOK_SECRET=whsec_menao_connect_ci"
            # Boutons Google et Apple affichés ; la redirection vers le fournisseur est interceptée.
            echo "NEXT_PUBLIC_OAUTH_PROVIDERS=google,apple"
          } >> "$GITHUB_ENV"
      - name: Installer Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Build
        run: pnpm --filter web build
      - name: Tests Playwright
        run: pnpm --filter web test:e2e
      - name: Captures des écrans (revue du design)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: captures-ecrans
          path: apps/web/test-results/**/captures/*.png
          if-no-files-found: ignore
          retention-days: 2
      - name: Journaux des Edge Functions
        if: failure()
        run: docker logs $(docker ps -aq --filter name=supabase_edge_runtime) 2>&1 | tail -150
      - name: Rapport Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 3

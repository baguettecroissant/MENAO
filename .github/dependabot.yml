version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
    open-pull-requests-limit: 5
    groups:
      mineures-et-correctifs:
        update-types: [minor, patch]
    ignore:
      # typescript-eslint ne supporte pas encore TypeScript 7 (voir ADR 0003).
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # Plugins de eslint-config-next pas encore compatibles ESLint 10 (voir ADR 0003).
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: "@eslint/js"
        update-types: [version-update:semver-major]
      # Les types Node suivent la version de Node du projet (.nvmrc : 22).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # Application : versions fixées par le SDK Expo (celles qu'embarque Expo Go). Elles se mettent
      # à jour avec `npx expo install --fix` dans apps/mobile, jamais par Dependabot (PR #404).
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@react-native/*"
      - dependency-name: "@react-native-community/*"
      - dependency-name: "@stripe/stripe-react-native"
      # React suit la version attendue par Expo (partagée avec le site).
      - dependency-name: "react"
      - dependency-name: "react-dom"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Paris
